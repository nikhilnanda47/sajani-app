version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sajani-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: sajani
      POSTGRES_PASSWORD: sajani_dev_password
      POSTGRES_DB: sajani_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sajani -d sajani_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
