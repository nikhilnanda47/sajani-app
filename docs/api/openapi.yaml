openapi: 3.0.3
info:
  title: Sajani API
  description: |
    REST API for Sajani — D2C Sambalpuri fashion e-commerce platform.
    Pilot scope: catalog browsing, cart/checkout, UPI + COD payments,
    inventory management, order lifecycle, and admin operations.

    ## Conventions
    - All monetary values are in **integer paise** (1 INR = 100 paise)
    - All timestamps are **UTC ISO 8601**
    - IDs are **UUID v4**
    - Pagination uses **cursor-based** approach
    - Phone numbers use **E.164 format** (+91XXXXXXXXXX)

    ## Authentication
    - Public endpoints: no auth required
    - Customer endpoints: Bearer JWT (obtained via OTP verify)
    - Admin endpoints: Bearer JWT with admin role claim

    ## Rate Limits
    - OTP request: 3/phone/10min, 10/IP/hour
    - Authenticated APIs: 100 req/min/user
    - Public APIs: 30 req/min/IP
  version: 1.0.0
  contact:
    name: Sajani Tech Team

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.staging.sajani.in
    description: Staging
  - url: https://api.sajani.in
    description: Production

tags:
  - name: Auth
    description: OTP-based phone authentication
  - name: Profile
    description: Customer profile management
  - name: Addresses
    description: Delivery address management
  - name: Categories
    description: Product categories
  - name: Products
    description: Product catalog (public)
  - name: Cart
    description: Shopping cart
  - name: Checkout
    description: Quote and order placement
  - name: Orders
    description: Customer order management
  - name: Payments
    description: Payment initiation and webhooks
  - name: "Admin: Catalog"
    description: Admin product and category management
  - name: "Admin: Inventory"
    description: Admin stock management
  - name: "Admin: Orders"
    description: Admin order operations
  - name: "Admin: Reports"
    description: Admin reporting
  - name: "Admin: Users"
    description: Admin user management
  - name: Health
    description: System health

# ─────────────────────────────────────────────────────────
# SECURITY SCHEMES
# ─────────────────────────────────────────────────────────
security: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from POST /auth/otp/verify

  # ─────────────────────────────────────────────────────────
  # REUSABLE SCHEMAS
  # ─────────────────────────────────────────────────────────
  schemas:

    # ── Envelope ──
    SuccessResponse:
      type: object
      required: [success, requestId]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        requestId:
          type: string
          example: req_abc123

    ErrorResponse:
      type: object
      required: [success, error, requestId]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: INV_001
            message:
              type: string
              example: Insufficient stock
            details:
              type: object
        requestId:
          type: string
          example: req_abc123

    ValidationError:
      type: object
      required: [success, error, requestId]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Validation failed
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
        requestId:
          type: string

    PaginationMeta:
      type: object
      properties:
        cursor:
          type: string
          nullable: true
          description: Cursor for next page; null if no more pages
        hasMore:
          type: boolean

    # ── Auth ──
    RequestOtpBody:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          pattern: '^\+91[6-9]\d{9}$'
          example: "+919876543210"

    RequestOtpResponse:
      type: object
      properties:
        message:
          type: string
          example: OTP sent successfully
        expiresInSeconds:
          type: integer
          example: 300

    VerifyOtpBody:
      type: object
      required: [phone, otp]
      properties:
        phone:
          type: string
          pattern: '^\+91[6-9]\d{9}$'
          example: "+919876543210"
        otp:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"

    VerifyOtpResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token (15 min expiry)
        refreshToken:
          type: string
          description: JWT refresh token (7 day expiry)
        isNewUser:
          type: boolean
          description: True if user was just created
        user:
          $ref: '#/components/schemas/UserProfile'

    RefreshTokenBody:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    RefreshTokenResponse:
      type: object
      properties:
        accessToken:
          type: string

    # ── User ──
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          example: "+919876543210"
        name:
          type: string
          nullable: true
          example: Priya Mishra
        email:
          type: string
          nullable: true
          example: priya@example.com
        verifiedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    UpdateProfileBody:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          example: Priya Mishra
        email:
          type: string
          format: email
          example: priya@example.com

    # ── Address ──
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          nullable: true
          example: Home
        recipientName:
          type: string
          example: Priya Mishra
        recipientPhone:
          type: string
          example: "+919876543210"
        line1:
          type: string
          example: "42, Budha Raja Street"
        line2:
          type: string
          nullable: true
          example: Near Samaleswari Temple
        landmark:
          type: string
          nullable: true
          example: Opposite SBI Branch
        city:
          type: string
          example: Sambalpur
        district:
          type: string
          example: Sambalpur
        state:
          type: string
          example: Odisha
        pinCode:
          type: string
          example: "768001"
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateAddressBody:
      type: object
      required: [recipientName, recipientPhone, line1, city, district, pinCode]
      properties:
        label:
          type: string
          maxLength: 50
        recipientName:
          type: string
          maxLength: 100
        recipientPhone:
          type: string
          pattern: '^\+91[6-9]\d{9}$'
        line1:
          type: string
          maxLength: 255
        line2:
          type: string
          maxLength: 255
        landmark:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
          default: Odisha
        pinCode:
          type: string
          pattern: '^[1-9][0-9]{5}$'
        isDefault:
          type: boolean
          default: false

    UpdateAddressBody:
      type: object
      properties:
        label:
          type: string
        recipientName:
          type: string
        recipientPhone:
          type: string
        line1:
          type: string
        line2:
          type: string
        landmark:
          type: string
        city:
          type: string
        district:
          type: string
        state:
          type: string
        pinCode:
          type: string
        isDefault:
          type: boolean

    # ── Category ──
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: heritage
        name:
          type: string
          example: Heritage Collection
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        sortOrder:
          type: integer
        active:
          type: boolean

    CreateCategoryBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 100
          description: Auto-generated from name if omitted
        description:
          type: string
        imageUrl:
          type: string
        sortOrder:
          type: integer
          default: 0

    UpdateCategoryBody:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        sortOrder:
          type: integer
        active:
          type: boolean

    # ── Product ──
    ProductCard:
      type: object
      description: Compact product representation for catalog lists
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: sambalpuri-ikat-silk-maroon-gold
        title:
          type: string
          example: "Sambalpuri Ikat Silk Saree – Maroon & Gold"
        shortDescription:
          type: string
          nullable: true
        categorySlug:
          type: string
          example: heritage
        primaryImage:
          type: object
          properties:
            url:
              type: string
            alt:
              type: string
        startingPricePaise:
          type: integer
          example: 350000
          description: Lowest active variant price in paise
        compareAtPaise:
          type: integer
          nullable: true
          example: 450000
        isAvailable:
          type: boolean
          description: True if any variant has stock > 0
        fabric:
          type: string
          nullable: true
          example: Pure Silk
        weaveMethod:
          type: string
          nullable: true
          example: Handloom Ikat

    ProductDetail:
      type: object
      description: Full product information for product detail page
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        shortDescription:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/Category'
        publishStatus:
          type: string
          enum: [draft, published, archived]
        fabric:
          type: string
          nullable: true
        weaveMethod:
          type: string
          nullable: true
        origin:
          type: string
          nullable: true
          example: "Sonepur, Subarnapur District, Odisha"
        careInstructions:
          type: string
          nullable: true
        blousePiece:
          type: string
          nullable: true
          example: "Included – 0.8m unstitched"
        length:
          type: string
          nullable: true
          example: "5.5 meters"
        width:
          type: string
          nullable: true
          example: "46 inches"
        weight:
          type: string
          nullable: true
          example: "450 grams"
        occasion:
          type: array
          items:
            type: string
          example: ["Festive", "Wedding"]
        tags:
          type: array
          items:
            type: string
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
        createdAt:
          type: string
          format: date-time

    Variant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          example: SAJ-IKT-MRN-001
        name:
          type: string
          nullable: true
          example: "Maroon with Gold Border"
        color:
          type: string
          nullable: true
          example: Maroon
        attributes:
          type: object
          additionalProperties: true
          example: { "border": "gold zari", "pallu": "contrast" }
        pricePaise:
          type: integer
          example: 350000
        compareAtPaise:
          type: integer
          nullable: true
          example: 450000
        available:
          type: integer
          description: Current available stock (on_hand - reserved - unavailable)
          example: 4
        isAvailable:
          type: boolean
        active:
          type: boolean

    MediaItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: CDN URL for display
        thumbnailUrl:
          type: string
          nullable: true
        type:
          type: string
          enum: [image, video]
        altText:
          type: string
          nullable: true
        sortOrder:
          type: integer

    CreateProductBody:
      type: object
      required: [title, categoryId, variants]
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        shortDescription:
          type: string
          maxLength: 500
        categoryId:
          type: string
          format: uuid
        publishStatus:
          type: string
          enum: [draft, published]
          default: draft
        fabric:
          type: string
          maxLength: 100
        weaveMethod:
          type: string
          maxLength: 100
        origin:
          type: string
          maxLength: 200
        careInstructions:
          type: string
        blousePiece:
          type: string
          maxLength: 100
        length:
          type: string
          maxLength: 50
        width:
          type: string
          maxLength: 50
        weight:
          type: string
          maxLength: 50
        occasion:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateVariantBody'

    CreateVariantBody:
      type: object
      required: [sku, pricePaise, initialStock]
      properties:
        sku:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 100
        color:
          type: string
          maxLength: 50
        attributes:
          type: object
          additionalProperties: true
        pricePaise:
          type: integer
          minimum: 1
        compareAtPaise:
          type: integer
          minimum: 1
          nullable: true
        initialStock:
          type: integer
          minimum: 0
          description: Sets initial on_hand inventory

    UpdateProductBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        categoryId:
          type: string
          format: uuid
        publishStatus:
          type: string
          enum: [draft, published, archived]
        fabric:
          type: string
        weaveMethod:
          type: string
        origin:
          type: string
        careInstructions:
          type: string
        blousePiece:
          type: string
        length:
          type: string
        width:
          type: string
        weight:
          type: string
        occasion:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string

    UpdateVariantBody:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
        attributes:
          type: object
        pricePaise:
          type: integer
          minimum: 1
        compareAtPaise:
          type: integer
          nullable: true
        active:
          type: boolean

    # ── Media Upload ──
    RequestUploadBody:
      type: object
      required: [productId, mimeType]
      properties:
        productId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
          nullable: true
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp, video/mp4]
        altText:
          type: string
          maxLength: 255

    RequestUploadResponse:
      type: object
      properties:
        uploadUrl:
          type: string
          description: Signed S3 PUT URL (expires in 5 min)
        objectKey:
          type: string
          description: S3 object key to use in confirm call

    ConfirmUploadBody:
      type: object
      required: [productId, objectKey]
      properties:
        productId:
          type: string
          format: uuid
        objectKey:
          type: string
        altText:
          type: string

    # ── Cart ──
    CartResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotalPaise:
          type: integer
          description: Sum of all line totals in paise
        itemCount:
          type: integer

    CartItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Cart item ID
        variant:
          type: object
          properties:
            id:
              type: string
              format: uuid
            sku:
              type: string
            name:
              type: string
              nullable: true
            color:
              type: string
              nullable: true
            pricePaise:
              type: integer
            available:
              type: integer
            productTitle:
              type: string
            productSlug:
              type: string
            imageUrl:
              type: string
              nullable: true
        quantity:
          type: integer
        lineTotalPaise:
          type: integer
          description: quantity × pricePaise
        isAvailable:
          type: boolean
          description: True if available >= quantity
        availabilityWarning:
          type: string
          nullable: true
          example: "Only 2 left in stock"

    AddToCartBody:
      type: object
      required: [variantId, quantity]
      properties:
        variantId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 10

    UpdateCartItemBody:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0
          maximum: 10
          description: Set to 0 to remove item

    # ── Checkout ──
    CheckoutQuoteBody:
      type: object
      required: [addressId, paymentMode]
      properties:
        addressId:
          type: string
          format: uuid
        paymentMode:
          type: string
          enum: [upi, cod]

    QuoteResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              variantId:
                type: string
                format: uuid
              productTitle:
                type: string
              sku:
                type: string
              quantity:
                type: integer
              unitPricePaise:
                type: integer
              lineTotalPaise:
                type: integer
              isAvailable:
                type: boolean
        subtotalPaise:
          type: integer
        shippingPaise:
          type: integer
        taxPaise:
          type: integer
        discountPaise:
          type: integer
        totalPaise:
          type: integer
        paymentMode:
          type: string
        codAvailable:
          type: boolean
          description: Whether COD is eligible for this PIN code
        estimatedDelivery:
          type: string
          nullable: true
          example: "5-7 business days"
        warnings:
          type: array
          items:
            type: string
          example: ["Only 2 units of SAJ-IKT-MRN-001 left"]

    PlaceOrderBody:
      type: object
      required: [addressId, paymentMode, idempotencyKey]
      properties:
        addressId:
          type: string
          format: uuid
        paymentMode:
          type: string
          enum: [upi, cod]
        idempotencyKey:
          type: string
          maxLength: 100
          description: Client-generated UUID to prevent duplicate orders
        notes:
          type: string
          maxLength: 500
          description: Delivery instructions

    # ── Order ──
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        publicNumber:
          type: string
          example: SAJ-20261115-0001
        status:
          type: string
          enum: [placed, confirmed, packed, shipped, delivered, cancelled, return_requested, return_approved, return_rejected, returned, refund_pending, refunded]
        paymentMode:
          type: string
          enum: [upi, cod]
        paymentStatus:
          type: string
          enum: [pending, initiated, success, failed, expired, cod_pending, refund_pending, refunded]
        subtotalPaise:
          type: integer
        shippingPaise:
          type: integer
        taxPaise:
          type: integer
        discountPaise:
          type: integer
        totalPaise:
          type: integer
        address:
          $ref: '#/components/schemas/Address'
        notes:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        shipment:
          $ref: '#/components/schemas/Shipment'
          nullable: true
        createdAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        shippedAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true

    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        productTitle:
          type: string
        variantName:
          type: string
          nullable: true
        sku:
          type: string
        qty:
          type: integer
        unitPricePaise:
          type: integer
        taxPaise:
          type: integer
        totalPaise:
          type: integer
        productImageUrl:
          type: string
          nullable: true

    OrderSummary:
      type: object
      description: Compact order for list views
      properties:
        id:
          type: string
          format: uuid
        publicNumber:
          type: string
        status:
          type: string
        paymentMode:
          type: string
        totalPaise:
          type: integer
        itemCount:
          type: integer
        primaryImageUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CancelOrderBody:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 255
          example: Changed my mind

    RequestReturnBody:
      type: object
      required: [orderItemId, qty, reason]
      properties:
        orderItemId:
          type: string
          format: uuid
        qty:
          type: integer
          minimum: 1
        reason:
          type: string
          enum: [damaged, wrong_product, not_as_described, other]
        reasonDetail:
          type: string
          maxLength: 500

    Shipment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        carrier:
          type: string
          nullable: true
          example: India Post
        trackingId:
          type: string
          nullable: true
        trackingUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, dispatched, in_transit, out_for_delivery, delivered, rto]
        estimatedDelivery:
          type: string
          format: date
          nullable: true
        dispatchedAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true

    # ── Payments ──
    InitiatePaymentResponse:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        gatewayOrderId:
          type: string
          description: Gateway order ID for client SDK
        checkoutOptions:
          type: object
          description: Gateway-specific options to pass to mobile SDK
          properties:
            key:
              type: string
              description: Gateway public key
            amount:
              type: integer
            currency:
              type: string
              example: INR
            orderId:
              type: string
            name:
              type: string
              example: Sajani
            description:
              type: string
            prefill:
              type: object
              properties:
                contact:
                  type: string

    # ── Inventory (Admin) ──
    StockResponse:
      type: object
      properties:
        variantId:
          type: string
          format: uuid
        sku:
          type: string
        productTitle:
          type: string
        onHand:
          type: integer
        reserved:
          type: integer
        unavailable:
          type: integer
        available:
          type: integer
          description: "on_hand - reserved - unavailable"

    AdjustStockBody:
      type: object
      required: [variantId, adjustment, reason]
      properties:
        variantId:
          type: string
          format: uuid
        adjustment:
          type: integer
          description: Positive to add, negative to remove
          example: 5
        reason:
          type: string
          enum: [received, damaged, correction, return_restocked, other]
        notes:
          type: string
          maxLength: 500

    # ── Admin Order ──
    UpdateOrderStatusBody:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed, packed, shipped, delivered, cancelled, return_approved, return_rejected, returned, refund_pending, refunded]
        carrier:
          type: string
          description: Required when status = shipped
        trackingId:
          type: string
          description: Required when status = shipped
        trackingUrl:
          type: string
        cancellationReason:
          type: string
          description: Required when status = cancelled
        adminNotes:
          type: string

    InitiateRefundBody:
      type: object
      properties:
        amountPaise:
          type: integer
          minimum: 1
          description: Partial or full refund amount. Defaults to full payment if omitted.
        reason:
          type: string

    # ── Reports ──
    OrdersReport:
      type: object
      properties:
        period:
          type: string
          example: "2026-11-01 to 2026-11-13"
        totalOrders:
          type: integer
        byStatus:
          type: object
          additionalProperties:
            type: integer
        gmvPaise:
          type: integer
          description: Gross merchandise value
        collectedPaise:
          type: integer
          description: Actually collected (excluding COD pending)
        codPendingPaise:
          type: integer
        refundedPaise:
          type: integer

    StockReport:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              variantId:
                type: string
              sku:
                type: string
              productTitle:
                type: string
              onHand:
                type: integer
              reserved:
                type: integer
              available:
                type: integer
              isLowStock:
                type: boolean
                description: True if available <= 2

    TopProductsReport:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              title:
                type: string
              totalQtySold:
                type: integer
              totalRevenuePaise:
                type: integer

    # ── Admin Users ──
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, catalog_editor, fulfillment_operator, support]
        status:
          type: string
          enum: [active, suspended]
        lastLoginAt:
          type: string
          format: date-time
          nullable: true

    CreateAdminUserBody:
      type: object
      required: [phone, name, role]
      properties:
        phone:
          type: string
          pattern: '^\+91[6-9]\d{9}$'
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, catalog_editor, fulfillment_operator, support]

    # ── Audit ──
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actorType:
          type: string
          enum: [admin, system, customer]
        actorId:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
          example: inventory.adjusted
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        beforeState:
          type: object
          nullable: true
        afterState:
          type: object
          nullable: true
        metadata:
          type: object
          nullable: true
          description: Additional context (reason, IP, etc.)
        createdAt:
          type: string
          format: date-time

    # ── Health ──
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 1.0.0
        uptime:
          type: number
        database:
          type: string
          enum: [connected, disconnected]

  # ─────────────────────────────────────────────────────────
  # REUSABLE PARAMETERS
  # ─────────────────────────────────────────────────────────
  parameters:
    CursorParam:
      name: cursor
      in: query
      schema:
        type: string
      description: Pagination cursor from previous response

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
      description: Number of items per page

    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID

    SlugParam:
      name: slug
      in: path
      required: true
      schema:
        type: string
      description: URL-friendly slug

# ─────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────
paths:

  # ── Health ──
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ────────────────────────────────────────────
  # AUTH
  # ────────────────────────────────────────────
  /api/v1/auth/otp/request:
    post:
      tags: [Auth]
      summary: Request OTP
      description: Send a 6-digit OTP to the given phone number. Rate limited.
      operationId: requestOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtpBody'
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/RequestOtpResponse'
        "400":
          description: Invalid phone format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP
      description: Verify OTP and receive JWT tokens. Creates user if new.
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpBody'
      responses:
        "200":
          description: OTP verified, tokens issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/VerifyOtpResponse'
        "400":
          description: OTP expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenBody'
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/RefreshTokenResponse'
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ────────────────────────────────────────────
  # PROFILE
  # ────────────────────────────────────────────
  /api/v1/me:
    get:
      tags: [Profile]
      summary: Get current user profile
      operationId: getProfile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Profile]
      summary: Update profile
      operationId: updateProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileBody'
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'

  # ────────────────────────────────────────────
  # ADDRESSES
  # ────────────────────────────────────────────
  /api/v1/me/addresses:
    get:
      tags: [Addresses]
      summary: List addresses
      operationId: listAddresses
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Address list (default first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Address'
    post:
      tags: [Addresses]
      summary: Create address
      operationId: createAddress
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressBody'
      responses:
        "201":
          description: Address created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Address'
        "400":
          description: Validation error or limit reached (max 10)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/addresses/{id}:
    patch:
      tags: [Addresses]
      summary: Update address
      operationId: updateAddress
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddressBody'
      responses:
        "200":
          description: Address updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Address'
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Addresses]
      summary: Delete address
      operationId: deleteAddress
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "200":
          description: Address deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ────────────────────────────────────────────
  # CATEGORIES (Public)
  # ────────────────────────────────────────────
  /api/v1/categories:
    get:
      tags: [Categories]
      summary: List active categories
      operationId: listCategories
      responses:
        "200":
          description: Category list sorted by sortOrder
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'

  # ────────────────────────────────────────────
  # PRODUCTS (Public)
  # ────────────────────────────────────────────
  /api/v1/products:
    get:
      tags: [Products]
      summary: Search and filter products
      description: |
        Paginated product catalog with search, filtering, and sorting.
        Only returns published products with active variants.
      operationId: listProducts
      parameters:
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
          description: Search in title, description, tags (ILIKE)
        - name: fabric
          in: query
          schema:
            type: string
          description: Exact match filter
        - name: weaveMethod
          in: query
          schema:
            type: string
        - name: color
          in: query
          schema:
            type: string
          description: Filter by variant color
        - name: minPrice
          in: query
          schema:
            type: integer
          description: Minimum price in paise
        - name: maxPrice
          in: query
          schema:
            type: integer
          description: Maximum price in paise
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [newest, price_asc, price_desc, relevance]
            default: newest
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ProductCard'
                          cursor:
                            type: string
                            nullable: true
                          hasMore:
                            type: boolean

  /api/v1/products/{slug}:
    get:
      tags: [Products]
      summary: Get product detail
      description: Full product info with variants, media, and availability.
      operationId: getProductBySlug
      parameters:
        - $ref: '#/components/parameters/SlugParam'
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ProductDetail'
        "404":
          description: Product not found or not published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ────────────────────────────────────────────
  # CART
  # ────────────────────────────────────────────
  /api/v1/cart:
    get:
      tags: [Cart]
      summary: Get cart
      description: Returns cart with server-calculated prices and availability warnings.
      operationId: getCart
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Cart contents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/CartResponse'

  /api/v1/cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      description: Adds a variant to cart. If already in cart, increments quantity.
      operationId: addToCart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartBody'
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/CartResponse'
        "400":
          description: Variant unavailable or quantity limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Variant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/cart/items/{id}:
    patch:
      tags: [Cart]
      summary: Update cart item quantity
      description: Set quantity to 0 to remove item.
      operationId: updateCartItem
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemBody'
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/CartResponse'
    delete:
      tags: [Cart]
      summary: Remove item from cart
      operationId: removeCartItem
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/CartResponse'

  # ────────────────────────────────────────────
  # CHECKOUT
  # ────────────────────────────────────────────
  /api/v1/checkout/quote:
    post:
      tags: [Checkout]
      summary: Get checkout quote
      description: |
        Server-calculated totals including shipping, tax, and COD eligibility.
        Does NOT reserve stock — only calculates.
      operationId: getCheckoutQuote
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutQuoteBody'
      responses:
        "200":
          description: Checkout quote
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/QuoteResponse'
        "400":
          description: Empty cart, invalid address, or PIN not serviceable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders:
    post:
      tags: [Checkout]
      summary: Place order
      description: |
        Atomically reserves stock, creates order with price snapshots, and clears cart.
        Uses idempotency key to prevent duplicate orders — if the same key is sent again,
        the existing order is returned (200) instead of creating a new one.
      operationId: placeOrder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderBody'
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Order'
        "200":
          description: Duplicate idempotency key — existing order returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Order'
        "400":
          description: Empty cart, variant unavailable, PIN not serviceable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Orders]
      summary: List my orders
      description: Customer's order history, newest first.
      operationId: listMyOrders
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        "200":
          description: Paginated order list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/OrderSummary'
                          cursor:
                            type: string
                            nullable: true
                          hasMore:
                            type: boolean

  # ────────────────────────────────────────────
  # ORDERS (Customer)
  # ────────────────────────────────────────────
  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      summary: Get order detail
      description: Full order detail. Customer can only view their own orders.
      operationId: getOrder
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "200":
          description: Order detail with items, shipment, payment info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Order'
        "404":
          description: Order not found or not owned by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel order
      description: |
        Customer cancellation. Only allowed when status is `placed` or `confirmed`.
        Releases inventory and initiates refund if payment was made.
      operationId: cancelOrder
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderBody'
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Order'
        "400":
          description: Order cannot be cancelled in current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders/{id}/return:
    post:
      tags: [Orders]
      summary: Request return
      description: |
        Request return for a delivered order. Must be within 7-day return window.
        Specify which item and quantity to return.
      operationId: requestReturn
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestReturnBody'
      responses:
        "200":
          description: Return request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "400":
          description: Not eligible for return (wrong status or window expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ────────────────────────────────────────────
  # PAYMENTS
  # ────────────────────────────────────────────
  /api/v1/payments/{orderId}/initiate:
    post:
      tags: [Payments]
      summary: Initiate UPI payment
      description: |
        Creates a payment order with the gateway and returns checkout options
        for the mobile SDK. Only for orders with paymentMode = upi.
      operationId: initiatePayment
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment initiated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/InitiatePaymentResponse'
        "400":
          description: Order not in payable status or wrong payment mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Payment already completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/webhooks/payments:
    post:
      tags: [Payments]
      summary: Payment gateway webhook
      description: |
        Receives payment events from the gateway. Verifies HMAC signature,
        deduplicates by event ID, validates amount, and updates order/payment status.

        **Not called by client apps — called by payment gateway server.**
      operationId: handlePaymentWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Gateway-specific webhook payload
      responses:
        "200":
          description: Webhook processed (or already processed — idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, already_processed]
        "401":
          description: Invalid webhook signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ────────────────────────────────────────────
  # ADMIN: CATEGORIES
  # ────────────────────────────────────────────
  /api/v1/admin/categories:
    post:
      tags: ["Admin: Catalog"]
      summary: Create category
      operationId: adminCreateCategory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryBody'
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Category'
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/categories/{id}:
    patch:
      tags: ["Admin: Catalog"]
      summary: Update category
      operationId: adminUpdateCategory
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryBody'
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Category'

  # ────────────────────────────────────────────
  # ADMIN: PRODUCTS
  # ────────────────────────────────────────────
  /api/v1/admin/products:
    get:
      tags: ["Admin: Catalog"]
      summary: List all products (including drafts)
      operationId: adminListProducts
      security:
        - BearerAuth: []
      parameters:
        - name: publishStatus
          in: query
          schema:
            type: string
            enum: [draft, published, archived]
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        "200":
          description: Product list with all statuses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ProductDetail'
                          cursor:
                            type: string
                            nullable: true
                          hasMore:
                            type: boolean
    post:
      tags: ["Admin: Catalog"]
      summary: Create product with variants
      description: |
        Creates product, variants, and initial inventory in a single transaction.
        Slug is auto-generated from title if not provided.
      operationId: adminCreateProduct
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductBody'
            example:
              title: "Sambalpuri Ikat Silk Saree – Maroon & Gold"
              description: "Handwoven Sambalpuri Ikat silk saree featuring traditional Bapta design..."
              categoryId: "uuid-here"
              publishStatus: draft
              fabric: "Pure Silk"
              weaveMethod: "Handloom Ikat"
              origin: "Sonepur, Subarnapur District, Odisha"
              careInstructions: "Dry clean only. Store in muslin cloth."
              blousePiece: "Included – 0.8m unstitched"
              length: "5.5 meters"
              width: "46 inches"
              weight: "450 grams"
              occasion: ["Festive", "Wedding"]
              tags: ["silk", "ikat", "bapta", "maroon"]
              variants:
                - sku: "SAJ-IKT-MRN-001"
                  name: "Maroon with Gold Border"
                  color: "Maroon"
                  attributes: { "border": "gold zari", "pallu": "contrast" }
                  pricePaise: 350000
                  compareAtPaise: 450000
                  initialStock: 5
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ProductDetail'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "409":
          description: SKU or slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/products/{id}:
    patch:
      tags: ["Admin: Catalog"]
      summary: Update product
      operationId: adminUpdateProduct
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductBody'
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ProductDetail'

  /api/v1/admin/products/{id}/variants:
    post:
      tags: ["Admin: Catalog"]
      summary: Add variant to product
      operationId: adminAddVariant
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVariantBody'
      responses:
        "201":
          description: Variant added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Variant'

  /api/v1/admin/products/{id}/variants/{variantId}:
    patch:
      tags: ["Admin: Catalog"]
      summary: Update variant
      operationId: adminUpdateVariant
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: variantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVariantBody'
      responses:
        "200":
          description: Variant updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Variant'

  # ── Media Upload ──
  /api/v1/admin/media/upload-url:
    post:
      tags: ["Admin: Catalog"]
      summary: Request signed upload URL
      description: Returns a signed S3 PUT URL for direct image/video upload.
      operationId: adminRequestUploadUrl
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestUploadBody'
      responses:
        "200":
          description: Signed upload URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/RequestUploadResponse'

  /api/v1/admin/media/confirm:
    post:
      tags: ["Admin: Catalog"]
      summary: Confirm upload and create media record
      description: Verifies the upload exists, generates thumbnails, and saves the media record.
      operationId: adminConfirmUpload
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUploadBody'
      responses:
        "201":
          description: Media record created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/MediaItem'

  /api/v1/admin/media/{id}:
    delete:
      tags: ["Admin: Catalog"]
      summary: Delete media
      operationId: adminDeleteMedia
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "200":
          description: Media deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ────────────────────────────────────────────
  # ADMIN: INVENTORY
  # ────────────────────────────────────────────
  /api/v1/admin/inventory:
    get:
      tags: ["Admin: Inventory"]
      summary: List all stock levels
      operationId: adminListInventory
      security:
        - BearerAuth: []
      parameters:
        - name: lowStock
          in: query
          schema:
            type: boolean
          description: Filter to items with available <= 2
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        "200":
          description: Inventory list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/StockResponse'
                          cursor:
                            type: string
                            nullable: true
                          hasMore:
                            type: boolean

  /api/v1/admin/inventory/adjustments:
    post:
      tags: ["Admin: Inventory"]
      summary: Adjust stock
      description: |
        Add or remove stock with an audited reason. Creates an audit_events record
        with before/after state.
      operationId: adminAdjustStock
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustStockBody'
      responses:
        "200":
          description: Stock adjusted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/StockResponse'
        "400":
          description: Adjustment would make stock negative
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ────────────────────────────────────────────
  # ADMIN: ORDERS
  # ────────────────────────────────────────────
  /api/v1/admin/orders:
    get:
      tags: ["Admin: Orders"]
      summary: Search orders
      operationId: adminListOrders
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [placed, confirmed, packed, shipped, delivered, cancelled, return_requested, return_approved, return_rejected, returned, refund_pending, refunded]
        - name: paymentMode
          in: query
          schema:
            type: string
            enum: [upi, cod]
        - name: search
          in: query
          schema:
            type: string
          description: Search by order number or customer phone
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Order'
                          cursor:
                            type: string
                            nullable: true
                          hasMore:
                            type: boolean

  /api/v1/admin/orders/{id}:
    get:
      tags: ["Admin: Orders"]
      summary: Get order detail (admin view)
      description: Includes customer info, full payment history, and audit trail.
      operationId: adminGetOrder
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "200":
          description: Full order detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Order'

  /api/v1/admin/orders/{id}/status:
    patch:
      tags: ["Admin: Orders"]
      summary: Update order status
      description: |
        Validates state transition and executes side effects:
        - shipped: requires carrier + trackingId
        - cancelled: releases inventory, initiates refund
        - returned: restocks inventory
        - refund_pending: triggers gateway refund
      operationId: adminUpdateOrderStatus
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusBody'
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Order'
        "400":
          description: Invalid state transition or missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/orders/{id}/refund:
    post:
      tags: ["Admin: Orders"]
      summary: Initiate refund
      description: Creates a refund via payment gateway. Amount defaults to full payment if omitted.
      operationId: adminInitiateRefund
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateRefundBody'
      responses:
        "200":
          description: Refund initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "400":
          description: No successful payment or refund exceeds payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

