      responses:
        "200":
          description: Top products report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/TopProductsReport'

  # ────────────────────────────────────────────
  # ADMIN: USERS
  # ────────────────────────────────────────────
  /api/v1/admin/users:
    get:
      tags: ["Admin: Users"]
      summary: List admin users
      operationId: adminListUsers
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Admin user list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminUser'
    post:
      tags: ["Admin: Users"]
      summary: Create admin user
      description: Owner-only. Creates a new admin with the specified role.
      operationId: adminCreateUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminUserBody'
      responses:
        "201":
          description: Admin user created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AdminUser'
        "403":
          description: Only owner can create admin users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Phone already registered as admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
