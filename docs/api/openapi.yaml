      operationId: adminOrdersReport
      security:
        - BearerAuth: []
      parameters:
        - name: fromDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Orders report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/OrdersReport'

  /api/v1/admin/reports/stock:
    get:
      tags: ["Admin: Reports"]
      summary: Stock summary report
      operationId: adminStockReport
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Stock report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/StockReport'

  /api/v1/admin/reports/top-products:
    get:
      tags: ["Admin: Reports"]
      summary: Top selling products
      operationId: adminTopProductsReport
      security:
        - BearerAuth: []
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
